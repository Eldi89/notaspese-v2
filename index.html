<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F6F5F1">
<title>Expense Note · LTA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
  :root{
    --paper:#F6F5F1; --surface:#FFFFFF; --ink:#1C2B33; --muted:#75807A;
    --line:#E3E1D9; --accent:#0E6E5C; --accent-ink:#FFFFFF; --danger:#B3402A;
    --warn-bg:#FBF3E2; --warn-ink:#7A5A18; --ok:#0E6E5C;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:60px;}
  header{padding:20px 18px 10px;}
  header h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em;}
  header p{margin:2px 0 0; color:var(--muted); font-size:13px;}
  main{padding:0 14px; max-width:560px; margin:0 auto;}
  section.card{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  h2{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:0 0 12px;}
  label{display:block; font-size:13px; font-weight:600; margin:12px 0 5px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=date],input[type=number],select{
    width:100%; padding:11px 12px; font-size:16px; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; background:var(--paper);
    appearance:none; -webkit-appearance:none;}
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  button{font:inherit; font-weight:600; border:none; border-radius:10px;
    padding:13px 16px; cursor:pointer; touch-action:manipulation;}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); width:100%; font-size:16px;}
  .btn-secondary{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .btn-ghost{background:transparent; color:var(--accent); padding:8px 10px;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row button{flex:1;}

  /* Receipt chip — perforated-edge look */
  .receipt-zone{margin-top:14px;}
  .receipt-chip{border:1.5px dashed var(--line); border-radius:10px; padding:12px;
    display:flex; align-items:center; gap:10px; background:var(--paper);}
  .receipt-chip.ok{border-color:var(--accent); background:#F0F7F4;}
  .receipt-chip .ric-info{flex:1; min-width:0;}
  .receipt-chip .ric-name{font-family:var(--mono); font-size:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .receipt-chip .ric-status{font-size:12px; color:var(--muted);}
  .receipt-chip.ok .ric-status{color:var(--ok); font-weight:600;}

  /* Total bar */
  .total-bar{background:var(--ink); color:#fff; border-radius:12px; padding:12px 16px;
    margin:14px 0 4px; display:flex; align-items:baseline; justify-content:space-between;}
  .total-bar .tb-label{font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; color:#B9C4BE;}
  .total-bar .tb-amt{font-family:var(--mono); font-size:19px; font-weight:700;}
  .total-bar .tb-sub{font-size:12px; color:#B9C4BE; margin-left:8px;}

  /* Expense list, ledger style */
  .month-head{font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); margin:18px 4px 8px;}
  .exp{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .exp .exp-main{flex:1; min-width:0;}
  .exp .exp-vendor{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .exp .exp-meta{font-size:12px; color:var(--muted); margin-top:1px;}
  .exp .exp-amt{font-family:var(--mono); font-size:15px; font-weight:600; text-align:right;}
  .exp .exp-flag{font-size:11px; text-align:right; margin-top:2px;}
  .flag-none{color:var(--muted);}
  .flag-pending{color:var(--warn-ink); font-weight:600;}
  .flag-exported{color:var(--ok);}
  .empty{color:var(--muted); text-align:center; padding:24px 10px; font-size:14px;}

  .banner{background:var(--warn-bg); color:var(--warn-ink); border-radius:12px;
    padding:12px 14px; font-size:13px; margin-bottom:14px; display:none;}
  .msg{border-radius:10px; padding:11px 13px; font-size:14px; margin-top:10px; display:none;}
  .msg.err{background:#FBECE7; color:var(--danger); display:block;}
  .msg.ok{background:#EDF6F2; color:var(--ok); display:block;}

  /* Crop overlay */
  #cropView{position:fixed; inset:0; background:#10161A; z-index:50; display:none;
    flex-direction:column;}
  #cropView.open{display:flex;}
  #cropView .crop-top{color:#fff; padding:14px 16px 6px; font-size:14px;}
  #cropCanvasWrap{flex:1; display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:6px;}
  #cropCanvas{max-width:100%; max-height:100%; touch-action:none;}
  #cropView .crop-actions{display:flex; gap:8px; padding:12px 14px calc(14px + env(safe-area-inset-bottom));}
  #cropView .crop-actions button{flex:1;}
  #cropStatus{color:#9FB0A9; font-size:12px; padding:0 16px 4px;}

  /* Modal */
  .modal-back{position:fixed; inset:0; background:rgba(16,22,26,.55); z-index:60;
    display:none; align-items:flex-end; justify-content:center;}
  .modal-back.open{display:flex;}
  .modal{background:var(--surface); width:100%; max-width:560px;
    border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  .modal h3{margin:0 0 6px; font-size:17px;}
  .modal p{margin:0 0 14px; font-size:14px; color:var(--muted); white-space:pre-line;}
  .modal .btn-col{display:flex; flex-direction:column; gap:8px;}

  .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spin{animation:none;} }
  footer{color:var(--muted); font-size:11px; text-align:center; padding:18px 14px;}
</style>
</head>
<body>

<header>
  <h1>Expense Note</h1>
  <p>Expenses, receipts and export — LTA US Advisors</p>
</header>

<main>
  <div class="banner" id="storageBanner"></div>

  <!-- ══════════ NUOVA SPESA ══════════ -->
  <section class="card">
    <h2>New expense</h2>

    <div class="row2">
      <div>
        <label for="fDate">Date</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label for="fAmount">Amount</label>
        <input type="number" id="fAmount" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      </div>
    </div>

    <label for="fVendor">Vendor / Place</label>
    <input type="text" id="fVendor" placeholder="E.g. Uber, Starbucks, Hotel…" autocomplete="off">

    <div class="row2">
      <div>
        <label for="fCategory">Category</label>
        <select id="fCategory">
          <option value="TRAVEL MEALS">Travel Meals</option>
          <option value="LODGING">Lodging</option>
          <option value="AIR">Air</option>
          <option value="TAXI/TOLLS/PARKING">Taxi / Tolls / Parking w/Tips</option>
          <option value="AIR/AUTO RENTAL/GAS">Air / Auto Rental / Gas for Rental</option>
          <option value="TEAM MEALS/EVENTS">Team Meals / Events</option>
          <option value="TRAVEL/METRO">Travel / Metro</option>
          <option value="DUES/MEMBERSHIPS">Dues / Memberships</option>
          <option value="TRAVEL TRAIN">Travel Train</option>
          <option value="TELEPHONE">Telephone</option>
        </select>
      </div>
      <div>
        <label for="fCurrency">Currency</label>
        <select id="fCurrency">
          <option>USD</option><option>EUR</option>
        </select>
      </div>
    </div>

    <label for="fPurpose">Business purpose</label>
    <input type="text" id="fPurpose" placeholder="E.g. Client meeting" autocomplete="off">

    <label for="fAttendees">Attendees</label>
    <input type="text" id="fAttendees" value="Eldi Trimi" autocomplete="off">

    <label for="fClient">Client</label>
    <input type="text" id="fClient" list="clientList" placeholder="E.g. SERIOPLAST" autocomplete="off">
    <datalist id="clientList">
      <option value="SERIOPLAST"><option value="LTA">
    </datalist>

    <!-- Ricevuta -->
    <div class="receipt-zone">
      <div class="receipt-chip" id="ricChip">
        <div class="ric-info">
          <div class="ric-status" id="ricStatus">No receipt</div>
          <div class="ric-name" id="ricName"></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px">
          <button class="btn-ghost" id="btnPhoto" type="button">📷 Take photo</button>
          <button class="btn-ghost" id="btnGallery" type="button">🖼️ Upload</button>
        </div>
      </div>
      <div class="btn-row" id="ricActions" style="display:none">
        <button class="btn-secondary" id="btnRicView" type="button">View</button>
        <button class="btn-secondary" id="btnRicRetake" type="button">Retake</button>
        <button class="btn-danger" id="btnRicDelete" type="button">Delete</button>
      </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>

    <div style="margin-top:16px">
      <button class="btn-primary" id="btnSave" type="button">Save expense</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </section>

  <!-- ══════════ EXPORT ══════════ -->
  <section class="card">
    <h2>Export</h2>
    <button class="btn-primary" id="btnExportZip" type="button">Download Excel + Receipts (ZIP)</button>
    <div class="btn-row">
      <button class="btn-secondary" id="btnExportXlsx" type="button">Excel only</button>
      <button class="btn-danger" id="btnDeleteAll" type="button">Delete all</button>
    </div>
    <div class="msg" id="exportMsg"></div>
  </section>

  <!-- ══════════ SPESE ══════════ -->
  <section>
    <div class="total-bar" id="totalBar" style="display:none">
      <span class="tb-label">Total entered</span>
      <span><span class="tb-amt" id="totalAmt"></span><span class="tb-sub" id="totalSub"></span></span>
    </div>
    <div id="expList"></div>
  </section>
</main>

<footer>Data stays on this device until you export it. Export at the end of each month.</footer>

<!-- ══════════ CROP VIEW ══════════ -->
<div id="cropView">
  <div class="crop-top">Drag the corners to the edges of the receipt</div>
  <div id="cropStatus"></div>
  <div id="cropCanvasWrap"><canvas id="cropCanvas"></canvas></div>
  <div class="crop-actions">
    <button class="btn-secondary" id="btnCropCancel" type="button">Cancel</button>
    <button class="btn-secondary" id="btnCropRetake" type="button">Retake photo</button>
    <button class="btn-primary" id="btnCropOk" type="button">Confirm</button>
  </div>
</div>

<!-- ══════════ MODAL ══════════ -->
<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="btn-col" id="modalBtns"></div>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════
   NOTA SPESE — single-file app, no build step.
   Spese: localStorage (piccoli JSON).
   Ricevute PDF: IndexedDB (blob), keyed su expenseId.
   Export: SheetJS (xlsx) + JSZip. PDF: jsPDF.
   Auto-crop: OpenCV.js caricato lazy; fallback ritaglio manuale.
   ═══════════════════════════════════════════════════════════ */

const LS_KEY = "ns_expenses_v2";
const MAX_WORK_SIDE = 2400;   // downscale prima di QUALSIASI canvas (limite iOS)
const MAX_PDF_SIDE  = 2000;   // lato max immagine dentro il PDF
const JPEG_Q = 0.72;
const MESI = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];

const $ = id => document.getElementById(id);

/* ─────────── Store spese (localStorage) ─────────── */
function loadExpenses(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ return []; }
}
function saveExpenses(list){
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}
let expenses = loadExpenses();

/* ─────────── Store ricevute (IndexedDB) ─────────── */
let dbPromise = null;
function db(){
  if(!dbPromise){
    dbPromise = new Promise((res, rej) => {
      const req = indexedDB.open("notaspese-db", 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore("receipts", { keyPath: "expenseId" });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  return dbPromise;
}
async function idbPut(rec){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction("receipts","readwrite");
    tx.objectStore("receipts").put(rec);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(id){
  const d = await db();
  return new Promise((res, rej) => {
    const rq = d.transaction("receipts").objectStore("receipts").get(id);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDelete(id){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction("receipts","readwrite");
    tx.objectStore("receipts").delete(id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbAll(){
  const d = await db();
  return new Promise((res, rej) => {
    const rq = d.transaction("receipts").objectStore("receipts").getAll();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => rej(rq.error);
  });
}

/* ─────────── Utility ─────────── */
function sanitizeName(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"_").slice(0,40) || "Receipt";
}
function fmtAmt(n, cur){
  const v = Number(n).toFixed(2);
  return (cur==="EUR" ? "€ " : "$ ") + v;
}
function receiptFilename(exp, existingNames){
  const base = `${exp.date}_${Number(exp.amount).toFixed(2)}_${sanitizeName(exp.vendor)}`;
  let name = base + ".pdf", i = 1;
  while(existingNames.has(name)){
    name = `${base}_${String(i).padStart(3,"0")}.pdf`; i++;
  }
  return name;
}
function showMsg(el, text, kind){
  el.className = "msg " + kind;
  el.textContent = text;
  if(kind === "ok") setTimeout(() => { el.className = "msg"; }, 4000);
}
/* Download/share robusto (lezione appresa: mai revocare l'URL subito) */
async function deliverFile(blob, filename, mime){
  const file = new File([blob], filename, { type: mime });
  if(navigator.share){
    try { await navigator.share({ files:[file], title:filename }); return true; }
    catch(e){
      if(e && e.name === "AbortError") return false; // annullato dall'utente
      /* share non disponibile per file: fallback download */
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}

/* ─────────── Modal ─────────── */
function modal(title, text, buttons){
  return new Promise(res => {
    $("modalTitle").textContent = title;
    $("modalText").textContent = text;
    const wrap = $("modalBtns"); wrap.innerHTML = "";
    buttons.forEach(b => {
      const btn = document.createElement("button");
      btn.className = b.cls || "btn-secondary";
      btn.textContent = b.label;
      btn.onclick = () => { $("modalBack").classList.remove("open"); res(b.value); };
      wrap.appendChild(btn);
    });
    $("modalBack").classList.add("open");
  });
}
$("modalBack").addEventListener("click", e => {
  if(e.target === $("modalBack")) $("modalBack").classList.remove("open");
});

/* ─────────── OpenCV lazy load ─────────── */
let cvState = "idle"; // idle | loading | ready | failed
let cvWaiters = [];
function loadOpenCV(){
  if(cvState === "ready") return Promise.resolve(true);
  if(cvState === "failed") return Promise.resolve(false);
  return new Promise(res => {
    cvWaiters.push(res);
    if(cvState === "loading") return;
    cvState = "loading";
    const s = document.createElement("script");
    s.src = "https://docs.opencv.org/4.9.0/opencv.js";
    const fail = () => { cvState = "failed"; cvWaiters.forEach(f => f(false)); cvWaiters = []; };
    const timer = setTimeout(fail, 20000);
    s.onload = () => {
      const check = () => {
        if(window.cv && cv.Mat){ clearTimeout(timer); cvState = "ready";
          cvWaiters.forEach(f => f(true)); cvWaiters = []; }
        else if(window.cv && cv.onRuntimeInitialized !== undefined){
          cv.onRuntimeInitialized = () => { clearTimeout(timer); cvState = "ready";
            cvWaiters.forEach(f => f(true)); cvWaiters = []; };
        } else setTimeout(check, 100);
      };
      check();
    };
    s.onerror = () => { clearTimeout(timer); fail(); };
    document.head.appendChild(s);
  });
}

/* ─────────── OCR locale (Tesseract) per prepopolare i campi ─────────── */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res;
    s.onerror = () => rej(new Error("caricamento script fallito"));
    document.head.appendChild(s);
  });
}
let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = (async () => {
      if(!window.Tesseract)
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js");
      return await Tesseract.createWorker("eng");
    })().catch(e => { ocrWorkerPromise = null; throw e; });
  }
  return ocrWorkerPromise;
}

function parseAmountStr(s){
  const lastC = s.lastIndexOf(","), lastD = s.lastIndexOf(".");
  if(lastC > -1 && lastD > -1){
    s = lastC > lastD ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,"");
  } else if(lastC > -1){ s = s.replace(",","."); }
  return parseFloat(s);
}
const MONTHS_EN = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function validDate(y, m, d){
  y = +y; m = +m; d = +d;
  const nowY = new Date().getFullYear();
  if(y < 2018 || y > nowY + 1 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function parseReceiptText(text){
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const numRe = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})/g;

  // Importo: prima le righe con parole chiave "total", altrimenti il numero plausibile più alto
  let amount = null, best = -1;
  const kw = /(GRAND\s*TOTAL|TOTAL|TOTALE|AMOUNT\s*DUE|BALANCE\s*DUE|IMPORTO)/i;
  for(const l of lines){
    if(!kw.test(l)) continue;
    for(const m of l.matchAll(numRe)){
      const v = parseAmountStr(m[1]);
      if(isFinite(v) && v > best && v < 100000) best = v;
    }
  }
  if(best <= 0){
    for(const l of lines){
      if(/card|auth|approv|conto|account|#/i.test(l)) continue;
      for(const m of l.matchAll(numRe)){
        const v = parseAmountStr(m[1]);
        if(isFinite(v) && v > best && v < 100000) best = v;
      }
    }
  }
  if(best > 0) amount = best;

  // Data: primo match valido nel testo (formati US e ISO più nomi mese)
  let dateISO = null;
  const t = text;
  let m;
  if((m = t.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))
    dateISO = validDate(m[1], m[2], m[3]);
  if(!dateISO && (m = t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))){
    dateISO = +m[1] > 12 ? validDate(m[3], m[2], m[1]) : validDate(m[3], m[1], m[2]);
  }
  if(!dateISO && (m = t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/i)))
    dateISO = validDate(m[3], MONTHS_EN[m[1].toLowerCase().slice(0,3)], m[2]);
  if(!dateISO && (m = t.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{4})/i)))
    dateISO = validDate(m[3], MONTHS_EN[m[2].toLowerCase().slice(0,3)], m[1]);
  if(!dateISO && (m = t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2})(?!\d)/))){
    dateISO = +m[1] > 12 ? validDate("20"+m[3], m[2], m[1]) : validDate("20"+m[3], m[1], m[2]);
  }

  // Fornitore: prima riga in alto con vere lettere, saltando le righe di servizio
  let vendor = null;
  const junk = /^(receipt|invoice|welcome|thank|order|table|guest|server|cashier|store\s*#|tel|phone|fax|www\.|http|\*)/i;
  for(const l of lines.slice(0, 6)){
    const letters = (l.match(/[A-Za-z]/g) || []).length;
    if(letters >= 3 && !junk.test(l) && !/^\d/.test(l)){
      vendor = l.replace(/\s{2,}/g," ").slice(0, 30); break;
    }
  }
  return { amount, dateISO, vendor };
}

async function openCrop(file, isScreenshot){
  // 1. Decode + downscale PRIMA di ogni elaborazione (vincolo memoria iOS)
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("immagine non leggibile"));
    i.src = url;
  });
  const scale = Math.min(1, MAX_WORK_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  workCanvas = document.createElement("canvas");
  workCanvas.width  = Math.round(img.naturalWidth  * scale);
  workCanvas.height = Math.round(img.naturalHeight * scale);
  workCanvas.getContext("2d").drawImage(img, 0, 0, workCanvas.width, workCanvas.height);
  URL.revokeObjectURL(url);

  const w = workCanvas.width, h = workCanvas.height;
  $("cropView").classList.add("open");

  if(isScreenshot){
    // screenshot: nessuna prospettiva da correggere — immagine intera, ritaglio opzionale
    const inset = 0.01;
    corners = [
      {x:w*inset, y:h*inset}, {x:w*(1-inset), y:h*inset},
      {x:w*(1-inset), y:h*(1-inset)}, {x:w*inset, y:h*(1-inset)}
    ];
    $("cropStatus").textContent = "Trim if needed — drag the corners, then Confirm";
    drawCrop();
    return;
  }

  // 2. Angoli di default, poi tentativo auto-detect
  const inset = 0.06;
  corners = [
    {x:w*inset, y:h*inset}, {x:w*(1-inset), y:h*inset},
    {x:w*(1-inset), y:h*(1-inset)}, {x:w*inset, y:h*(1-inset)}
  ];
  drawCrop();

  $("cropStatus").textContent = "Detecting edges…";
  const hasCv = await loadOpenCV();
  if(hasCv){
    const det = detectQuad(workCanvas);
    if(det){ corners = det; $("cropStatus").textContent = "Edges detected — adjust if needed"; }
    else $("cropStatus").textContent = "Edges not detected — position the corners manually";
  } else {
    $("cropStatus").textContent = "Manual crop — position the corners";
  }
  drawCrop();
}

function detectQuad(canvas){
  try{
    // detection su copia ridotta: molto più veloce, stessa precisione pratica
    const detScale = Math.min(1, 900 / Math.max(canvas.width, canvas.height));
    let srcCanvas = canvas;
    if(detScale < 1){
      srcCanvas = document.createElement("canvas");
      srcCanvas.width  = Math.round(canvas.width  * detScale);
      srcCanvas.height = Math.round(canvas.height * detScale);
      srcCanvas.getContext("2d").drawImage(canvas, 0, 0, srcCanvas.width, srcCanvas.height);
    }
    const src = cv.imread(srcCanvas);
    const gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5,5), 0);
    const minArea = src.cols * src.rows * 0.15;
    let best = null, bestArea = minArea;

    const scanQuads = (bin) => {
      const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5,5));
      cv.dilate(bin, bin, kernel); kernel.delete();
      const contours = new cv.MatVector(), hier = new cv.Mat();
      cv.findContours(bin, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
      for(let i = 0; i < contours.size(); i++){
        const c = contours.get(i);
        const peri = cv.arcLength(c, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(c, approx, 0.02 * peri, true);
        if(approx.rows === 4 && cv.isContourConvex(approx)){
          const area = Math.abs(cv.contourArea(approx));
          if(area > bestArea){
            bestArea = area; best = [];
            for(let j = 0; j < 4; j++)
              best.push({ x: approx.data32S[j*2], y: approx.data32S[j*2+1] });
          }
        }
        approx.delete(); c.delete();
      }
      contours.delete(); hier.delete();
    };

    // Strategia 1+2: Canny con due soglie diverse
    for(const [lo, hi] of [[50,150],[30,90]]){
      const e = new cv.Mat();
      cv.Canny(gray, e, lo, hi);
      scanQuads(e); e.delete();
    }
    // Strategia 3: soglia adattiva (ricevuta chiara su sfondo chiaro)
    if(!best){
      const th = new cv.Mat();
      cv.adaptiveThreshold(gray, th, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C,
        cv.THRESH_BINARY_INV, 25, 10);
      scanQuads(th); th.delete();
    }
    // Strategia 4: rettangolo minimo attorno al contorno più grande
    if(!best){
      const e = new cv.Mat();
      cv.Canny(gray, e, 30, 90);
      const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(7,7));
      cv.dilate(e, e, kernel); kernel.delete();
      const contours = new cv.MatVector(), hier = new cv.Mat();
      cv.findContours(e, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let bigIdx = -1, bigA = src.cols * src.rows * 0.2;
      for(let i = 0; i < contours.size(); i++){
        const a = cv.contourArea(contours.get(i));
        if(a > bigA){ bigA = a; bigIdx = i; }
      }
      if(bigIdx >= 0){
        const rr = cv.minAreaRect(contours.get(bigIdx));
        const pts = cv.RotatedRect.points(rr);
        best = pts.map(p => ({ x:p.x, y:p.y }));
      }
      contours.delete(); hier.delete(); e.delete();
    }

    src.delete(); gray.delete();
    if(!best) return null;
    const inv = 1 / detScale;
    return orderCorners(best.map(p => ({
      x: Math.max(0, Math.min(canvas.width,  p.x * inv)),
      y: Math.max(0, Math.min(canvas.height, p.y * inv))
    })));
  } catch(e){ return null; }
}
function orderCorners(pts){
  // TL = somma x+y minima, BR = massima; gli altri due per posizione x
  const bySum = [...pts].sort((a,b) => (a.x+a.y) - (b.x+b.y));
  const tl = bySum[0], br = bySum[3];
  const rest = pts.filter(p => p !== tl && p !== br);
  if(rest.length !== 2) return null;
  const tr = rest[0].x > rest[1].x ? rest[0] : rest[1];
  const bl = rest[0].x > rest[1].x ? rest[1] : rest[0];
  return [tl, tr, br, bl];
}

/* ── Crop UI: canvas + 4 handle trascinabili ── */
const cropCanvas = $("cropCanvas");
function drawCrop(){
  const wrap = $("cropCanvasWrap");
  const availW = wrap.clientWidth - 12, availH = wrap.clientHeight - 12;
  cropDisplayScale = Math.min(availW / workCanvas.width, availH / workCanvas.height, 1);
  cropCanvas.width  = Math.round(workCanvas.width  * cropDisplayScale);
  cropCanvas.height = Math.round(workCanvas.height * cropDisplayScale);
  const ctx = cropCanvas.getContext("2d");
  ctx.drawImage(workCanvas, 0, 0, cropCanvas.width, cropCanvas.height);
  // velo fuori dal poligono
  ctx.save();
  ctx.fillStyle = "rgba(16,22,26,.55)";
  ctx.beginPath();
  ctx.rect(0, 0, cropCanvas.width, cropCanvas.height);
  const p = corners.map(c => ({ x:c.x*cropDisplayScale, y:c.y*cropDisplayScale }));
  ctx.moveTo(p[0].x, p[0].y);
  for(let i = 3; i >= 1; i--) ctx.lineTo(p[i].x, p[i].y);
  ctx.closePath();
  ctx.fill("evenodd");
  ctx.restore();
  // bordo + handle
  ctx.strokeStyle = "#2FBF9B"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y);
  p.slice(1).forEach(q => ctx.lineTo(q.x, q.y));
  ctx.closePath(); ctx.stroke();
  p.forEach(q => {
    ctx.beginPath(); ctx.arc(q.x, q.y, 13, 0, Math.PI*2);
    ctx.fillStyle = "rgba(47,191,155,.28)"; ctx.fill();
    ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, Math.PI*2);
    ctx.fillStyle = "#2FBF9B"; ctx.fill();
  });
}
let dragIdx = -1;
function cropPos(ev){
  const r = cropCanvas.getBoundingClientRect();
  return { x:(ev.clientX - r.left) / cropDisplayScale,
           y:(ev.clientY - r.top)  / cropDisplayScale };
}
cropCanvas.addEventListener("pointerdown", ev => {
  const pos = cropPos(ev);
  let best = -1, bestD = 45 / cropDisplayScale; // raggio cattura generoso
  corners.forEach((c,i) => {
    const d = Math.hypot(c.x-pos.x, c.y-pos.y);
    if(d < bestD){ bestD = d; best = i; }
  });
  dragIdx = best;
  if(dragIdx >= 0) cropCanvas.setPointerCapture(ev.pointerId);
});
cropCanvas.addEventListener("pointermove", ev => {
  if(dragIdx < 0) return;
  const pos = cropPos(ev);
  corners[dragIdx] = {
    x: Math.max(0, Math.min(workCanvas.width,  pos.x)),
    y: Math.max(0, Math.min(workCanvas.height, pos.y))
  };
  drawCrop();
});
cropCanvas.addEventListener("pointerup", () => { dragIdx = -1; });
window.addEventListener("resize", () => {
  if($("cropView").classList.contains("open")) drawCrop();
});

function extractDocument(canvas, pts){
  const wTop = Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y);
  const wBot = Math.hypot(pts[2].x-pts[3].x, pts[2].y-pts[3].y);
  const hL   = Math.hypot(pts[3].x-pts[0].x, pts[3].y-pts[0].y);
  const hR   = Math.hypot(pts[2].x-pts[1].x, pts[2].y-pts[1].y);
  let outW = Math.round(Math.max(wTop, wBot));
  let outH = Math.round(Math.max(hL, hR));
  const s = Math.min(1, MAX_PDF_SIDE / Math.max(outW, outH));
  outW = Math.max(80, Math.round(outW*s));
  outH = Math.max(80, Math.round(outH*s));

  if(cvState === "ready"){
    try{
      const src = cv.imread(canvas);
      const dst = new cv.Mat();
      const from = cv.matFromArray(4,1,cv.CV_32FC2,
        [pts[0].x,pts[0].y, pts[1].x,pts[1].y, pts[2].x,pts[2].y, pts[3].x,pts[3].y]);
      const to = cv.matFromArray(4,1,cv.CV_32FC2, [0,0, outW,0, outW,outH, 0,outH]);
      const M = cv.getPerspectiveTransform(from, to);
      cv.warpPerspective(src, dst, M, new cv.Size(outW, outH),
        cv.INTER_LINEAR, cv.BORDER_REPLICATE);
      const out = document.createElement("canvas");
      out.width = outW; out.height = outH;
      cv.imshow(out, dst);
      src.delete(); dst.delete(); from.delete(); to.delete(); M.delete();
      return enhance(out);
    } catch(e){ /* fallback sotto */ }
  }
  // Fallback senza OpenCV: ritaglio del bounding box (niente correzione prospettica)
  const minX = Math.min(...pts.map(p=>p.x)), maxX = Math.max(...pts.map(p=>p.x));
  const minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
  const out = document.createElement("canvas");
  const bw = maxX-minX, bh = maxY-minY;
  const s2 = Math.min(1, MAX_PDF_SIDE / Math.max(bw, bh));
  out.width = Math.max(80, Math.round(bw*s2));
  out.height = Math.max(80, Math.round(bh*s2));
  out.getContext("2d").drawImage(canvas, minX, minY, bw, bh, 0, 0, out.width, out.height);
  return enhance(out);
}
function enhance(canvas){
  // leggero boost di leggibilità, mai aggressivo
  const out = document.createElement("canvas");
  out.width = canvas.width; out.height = canvas.height;
  const ctx = out.getContext("2d");
  try { ctx.filter = "contrast(1.08) brightness(1.03) saturate(0.85)"; } catch(e){}
  ctx.drawImage(canvas, 0, 0);
  return out;
}
async function canvasToPdfBlob(canvas){
  const dataUrl = canvas.toDataURL("image/jpeg", JPEG_Q);
  const { jsPDF } = window.jspdf;
  // pagina PDF con le proporzioni della ricevuta, in pt (1 px ≈ 0.5 pt per compattezza)
  const wPt = canvas.width * 0.5, hPt = canvas.height * 0.5;
  const pdf = new jsPDF({ unit:"pt",
    format:[wPt, hPt], orientation: wPt > hPt ? "landscape" : "portrait" });
  pdf.addImage(dataUrl, "JPEG", 0, 0, wPt, hPt);
  return pdf.output("blob");
}

async function renderList(){
  const wrap = $("expList");
  wrap.innerHTML = "";
  // totale di tutte le spese inserite, separato per valuta
  const bar = $("totalBar");
  if(expenses.length === 0){
    bar.style.display = "none";
  } else {
    const sums = {};
    expenses.forEach(e => {
      sums[e.currency] = (sums[e.currency] || 0) + Number(e.amount);
    });
    const parts = Object.entries(sums).map(([cur,v]) => fmtAmt(v, cur));
    $("totalAmt").textContent = parts.join("  +  ");
    $("totalSub").textContent = `· ${expenses.length} expense${expenses.length===1?"":"s"}`;
    bar.style.display = "flex";
  }
  if(expenses.length === 0){
    wrap.innerHTML = '<div class="empty">No expenses yet.\nAdd the first one above.</div>';
    return;
  }
  const receipts = await idbAll();
  const rMap = new Map(receipts.map(r => [r.expenseId, r]));
  const sorted = [...expenses].sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  let lastMonth = "";
  sorted.forEach(exp => {
    const mk = exp.date.slice(0,7);
    if(mk !== lastMonth){
      lastMonth = mk;
      const [y,m] = mk.split("-");
      const h = document.createElement("div");
      h.className = "month-head";
      h.textContent = `${MESI[parseInt(m,10)-1]} ${y}`;
      wrap.appendChild(h);
    }
    const rec = rMap.get(exp.id);
    const div = document.createElement("div");
    div.className = "exp";
    let flag = '<span class="flag-none">— no receipt</span>';
    if(rec) flag = rec.exportedAt
      ? '<span class="flag-exported">📎 exported ✓</span>'
      : '<span class="flag-pending">📎 to export</span>';
    div.innerHTML = `
      <div class="exp-main">
        <div class="exp-vendor"></div>
        <div class="exp-meta"></div>
      </div>
      <div>
        <div class="exp-amt"></div>
        <div class="exp-flag">${flag}</div>
      </div>`;
    div.querySelector(".exp-vendor").textContent = exp.vendor;
    div.querySelector(".exp-meta").textContent =
      `${exp.date} · ${exp.category}` + (exp.client ? ` · ${exp.client}` : "");
    div.querySelector(".exp-amt").textContent = fmtAmt(exp.amount, exp.currency);
    div.addEventListener("click", () => expenseActions(exp, rec));
    wrap.appendChild(div);
  });
}

async function expenseActions(exp, rec){
  const btns = [];
  if(rec){
    btns.push({ label:"View receipt", value:"view", cls:"btn-secondary" });
    btns.push({ label:"Replace receipt", value:"replace", cls:"btn-secondary" });
    btns.push({ label:"Delete receipt only", value:"delRic", cls:"btn-danger" });
  } else {
    btns.push({ label:"Add receipt", value:"addRic", cls:"btn-secondary" });
  }
  btns.push({ label:"Delete expense", value:"delExp", cls:"btn-danger" });
  btns.push({ label:"Close", value:null, cls:"btn-secondary" });

  const info = `${exp.date} · ${fmtAmt(exp.amount, exp.currency)}` +
    (rec ? `\n${rec.filename}${rec.exportedAt ? " · exported ✓" : " · NOT exported yet"}` : "");
  const act = await modal(exp.vendor, info, btns);

  if(act === "view"){
    await deliverFile(rec.blob, rec.filename, "application/pdf");
  }
  if(act === "replace" || act === "addRic"){
    const src = await modal(act === "replace" ? "Replace receipt" : "Add receipt",
      "How do you want to attach it?",
      [{label:"📷 Take photo", value:"camera", cls:"btn-secondary"},
       {label:"🖼️ Upload screenshot / image", value:"gallery", cls:"btn-secondary"},
       {label:"Cancel", value:null, cls:"btn-secondary"}]);
    if(src){ retakeTargetId = exp.id; startCapture(src); }
  }
  if(act === "delRic"){
    if(!rec.exportedAt){
      const ok = await modal("Receipt not exported",
        "This receipt has never been exported. If you delete it, it is gone.",
        [{label:"Delete anyway", value:true, cls:"btn-danger"},
         {label:"Cancel", value:false, cls:"btn-secondary"}]);
      if(!ok) return;
    }
    await idbDelete(exp.id);
    exp.hasReceipt = false; saveExpenses(expenses);
    renderList(); updateBanner();
  }
  if(act === "delExp"){
    let warn = "The expense will be deleted.";
    if(rec && !rec.exportedAt)
      warn = "This expense has a receipt that was NEVER exported.\nDeleting it also deletes the PDF.";
    const ok = await modal("Delete this expense?", warn,
      [{label:"Delete", value:true, cls:"btn-danger"},
       {label:"Cancel", value:false, cls:"btn-secondary"}]);
    if(!ok) return;
    await idbDelete(exp.id); // mai ricevute orfane
    expenses = expenses.filter(x => x.id !== exp.id);
    saveExpenses(expenses);
    renderList(); updateBanner();
  }
}

/* ─────────── Export: fills the official LTA template ─────────── */
let excelJsPromise = null;
function getExcelJS(){
  if(!excelJsPromise){
    excelJsPromise = loadScript(
      "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"
    ).catch(e => { excelJsPromise = null; throw e; });
  }
  return excelJsPromise;
}
// mapping app category → template column (Sheet1, rows 16–53)
const CATEGORY_COL = {
  "AIR/AUTO RENTAL/GAS": "F",
  "TAXI/TOLLS/PARKING": "G",
  "TRAVEL MEALS": "H",
  "AIR": "I",
  "LODGING": "J",
  "TEAM MEALS/EVENTS": "K",
  "TRAVEL/METRO": "L",
  "DUES/MEMBERSHIPS": "M",
  "TRAVEL TRAIN": "N",
  "TELEPHONE": "O",
  // legacy values from earlier app versions
  "TAXI": "G", "OTHER": "L"
};
const TPL_FIRST = 16, TPL_LAST = 115;

async function buildFilledTemplate(list){
  await getExcelJS();
  const resp = await fetch("template.xlsx", { cache: "no-store" });
  if(!resp.ok) throw new Error("template.xlsx not found in the repo");
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await resp.arrayBuffer());
  const ws = wb.getWorksheet("Sheet1") || wb.worksheets[0];

  const today = new Date();
  ws.getCell("D7").value = new Date(Date.UTC(
    today.getFullYear(), today.getMonth(), today.getDate()));

  const sorted = [...list].sort((a,b) => a.date.localeCompare(b.date));
  const cap = TPL_LAST - TPL_FIRST + 1;
  if(sorted.length > cap)
    throw new Error(`The form holds ${cap} rows; you have ${sorted.length} expenses. Export in two batches.`);

  sorted.forEach((e, i) => {
    const r = TPL_FIRST + i;
    const [y,m,d] = e.date.split("-").map(Number);
    const dCell = ws.getCell("B"+r);
    dCell.value = new Date(Date.UTC(y, m-1, d));
    if(!dCell.numFmt) dCell.numFmt = "mm/dd/yyyy";
    ws.getCell("C"+r).value = e.vendor;
    ws.getCell("D"+r).value = e.purpose || "";
    ws.getCell("E"+r).value = e.attendees || "";
    const col = CATEGORY_COL[(e.category||"").toUpperCase()] || "G";
    ws.getCell(col+r).value = Number(e.amount);
    if(e.client) ws.getCell("Q"+r).value = e.client;
  });
  return await wb.xlsx.writeBuffer();
}
const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
function exportLabel(){
  const months = [...new Set(expenses.map(e => e.date.slice(0,7)))];
  if(months.length === 1){
    const [y,m] = months[0].split("-");
    return `${MESI[parseInt(m,10)-1]}_${y}`;
  }
  return "Export_" + new Date().toISOString().slice(0,10);
}

$("btnExportXlsx").addEventListener("click", async () => {
  if(expenses.length === 0){ showMsg($("exportMsg"), "No expenses to export.", "err"); return; }
  try{
    const buf = await buildFilledTemplate(expenses);
    const blob = new Blob([buf], { type: XLSX_MIME });
    await deliverFile(blob, `Expense_Note_${exportLabel()}.xlsx`, XLSX_MIME);
  } catch(err){ showMsg($("exportMsg"), "Export error: " + err.message, "err"); }
});

$("btnExportZip").addEventListener("click", async () => {
  if(expenses.length === 0){ showMsg($("exportMsg"), "No expenses to export.", "err"); return; }
  const btn = $("btnExportZip");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Building the archive…';
  try{
    const label = exportLabel();
    const zip = new JSZip();
    const buf = await buildFilledTemplate(expenses);
    zip.file(`Expense_Note_${label}.xlsx`, buf);
    const receipts = await idbAll();
    const validIds = new Set(expenses.map(e => e.id));
    const folder = zip.folder("Receipts");
    let n = 0;
    for(const r of receipts){
      if(!validIds.has(r.expenseId)) continue;
      folder.file(r.filename, r.blob);
      n++;
    }
    const blob = await zip.generateAsync({ type:"blob",
      compression:"DEFLATE", compressionOptions:{ level:6 } });
    const delivered = await deliverFile(blob, `Expense_Note_${label}.zip`, "application/zip");
    if(delivered){
      // mark receipts as exported ONLY after successful delivery
      const now = Date.now();
      for(const r of receipts){
        if(validIds.has(r.expenseId)){ r.exportedAt = now; await idbPut(r); }
      }
      showMsg($("exportMsg"), `Archive ready: Excel + ${n} receipts.`, "ok");
      renderList(); updateBanner();
    }
  } catch(err){
    showMsg($("exportMsg"), "Export error: " + err.message, "err");
  } finally {
    btn.disabled = false; btn.textContent = "Download Excel + Receipts (ZIP)";
  }
});

$("btnDeleteAll").addEventListener("click", async () => {
  if(expenses.length === 0) return;
  const receipts = await idbAll();
  const validIds = new Set(expenses.map(e => e.id));
  const unexported = receipts.filter(r => validIds.has(r.expenseId) && !r.exportedAt).length;
  let text = `This will delete ${expenses.length} expenses and all receipts.`;
  if(unexported > 0)
    text = `WARNING: ${unexported} receipt${unexported===1?" has":"s have"} NOT been exported yet.\n\nIf you delete now, those PDFs are lost forever.\nExport the ZIP first, then delete.`;
  const ok = await modal("Delete everything?", text,
    [{label: unexported > 0 ? "I understand, delete anyway" : "Delete everything",
      value:true, cls:"btn-danger"},
     {label:"Cancel", value:false, cls:"btn-secondary"}]);
  if(!ok) return;
  if(unexported > 0){
    const ok2 = await modal("Final confirmation",
      `Confirm permanent deletion of ${unexported} never-exported receipt${unexported===1?"":"s"}?`,
      [{label:"Yes, delete permanently", value:true, cls:"btn-danger"},
       {label:"No, go back", value:false, cls:"btn-secondary"}]);
    if(!ok2) return;
  }
  for(const r of receipts) await idbDelete(r.expenseId);
  expenses = []; saveExpenses(expenses);
  renderList(); updateBanner();
  showMsg($("exportMsg"), "All data deleted.", "ok");
});

/* ─────────── Banner promemoria export ─────────── */
async function updateBanner(){
  const b = $("storageBanner");
  try{
    const receipts = await idbAll();
    const validIds = new Set(expenses.map(e => e.id));
    const old = receipts.filter(r => validIds.has(r.expenseId) && !r.exportedAt &&
      Date.now() - r.createdAt > 14*24*3600*1000);
    if(old.length > 0){
      b.style.display = "block";
      b.textContent = `\u26a0\ufe0f You have ${old.length} receipt${old.length===1?"":"s"} older than 2 weeks that ${old.length===1?"was":"were"} never exported. Safari can clear local data of rarely used sites: download the ZIP as soon as you can.`;
    } else b.style.display = "none";
  } catch(e){ b.style.display = "none"; }
}

/* ─────────── Init ─────────── */
(function init(){
  const today = new Date();
  $("fDate").value = today.toISOString().slice(0,10);
  renderList(); updateBanner();
  // precarica il motore di rilevamento bordi: alla prima foto è già pronto
  window.addEventListener("load", () => setTimeout(loadOpenCV, 1200));
})();
</script>
